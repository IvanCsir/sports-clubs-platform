services:
  postgres:
    image: postgres:16-alpine
    container_name: clubs-platform-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubs
      POSTGRES_PASSWORD: clubs
      POSTGRES_DB: clubs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
